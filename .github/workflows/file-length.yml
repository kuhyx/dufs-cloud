name: file-length

# The 250-line cap, enforced on push as well as at commit time. The local
# pre-commit hook can be skipped (a fresh clone has no hooks installed), so the
# cap needs a second gate nobody can forget to install.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  file-length:
    name: file length <= 250 lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate and its exemption list live in the shared utils repo so every
      # repo enforces the same cap.
      - name: Check out the shared gate
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils

      - name: Enforce the cap
        run: UTILS_ROOT="$PWD/.utils" bash scripts/check_file_length.sh --all
