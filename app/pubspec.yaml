name: dufs_client
description: "Mobile client for the self-hosted dufs cloud: browse, view, upload."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  chewie: ^1.8.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  video_player: ^2.9.2
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.2.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
