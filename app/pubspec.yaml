name: dufs_client
description: "Mobile client for the self-hosted dufs cloud: browse, view, upload."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  image_picker: ^1.1.2
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_linux: ^1.2.1
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.0
  xml: ^6.5.0

dev_dependencies:
  # Generates the Android launcher icons from assets/icon/ (see
  # python_pkg/app_icons in testsAndMisc for the shared style).
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.2.0
  webview_flutter_platform_interface: ^2.14.0

flutter:
  uses-material-design: true
  assets:
    # libass needs a real font file on Android: fontconfig cannot see the
    # system fonts, so ASS subtitles fail to render without a bundled one.
    - assets/fonts/subfont.ttf
    - assets/pdfjs/build/
    - assets/pdfjs/web/
    - assets/pdfjs/web/cmaps/
    - assets/pdfjs/web/iccs/
    - assets/pdfjs/web/images/
    - assets/pdfjs/web/locale/
    - assets/pdfjs/web/locale/en-US/
    - assets/pdfjs/web/standard_fonts/
    - assets/pdfjs/web/wasm/

# Launcher icon generation. Source art is produced by the shared generator:
#   PYTHONPATH=~/testsAndMisc python3 -m python_pkg.app_icons generate --app dufs_client
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
